# The game on Lambda (docs/serverless-plan.md, step 2): the container image (Dockerfile) as an arm64 function, reached
# only through CloudFront (the function URL takes IAM auth, and only this distribution may sign for it: Origin Access
# Control), with a role that reads the data and reads and writes built cells in the bucket. Deployed by
# deploy/deploy.sh with the image just pushed.
#
# With GoogleClientId and CloudFrontPublicKey (deploy.sh passes both once the client exists), sign-in with Google
# (crates/cellgen/src/auth.rs): cells and air traffic need CloudFront signed cookies, checked at the edge against the
# key group, and the players and sessions live in an Aurora DSQL cluster. Without them, everything is public and
# concurrency stays low. The viewer's files are always public (its sign-in screen). The server is GET-only (OAC would
# need signed bodies otherwise).
AWSTemplateFormatVersion: "2010-09-09"
Description: koldenworld game server (Lambda behind CloudFront)

Parameters:
  ImageUri:
    Type: String
    Description: The image to run (repository URI and tag), arm64.
  Bucket:
    Type: String
    Default: koldenworld-data-2
  Domain:
    Type: String
    Default: koldenworld.squarelabs.net
  CertificateArn:
    Type: String
    Default: ""
    Description: The ACM certificate for Domain (cert.yml, us-east-1), once issued; empty serves only the
      distribution's own *.cloudfront.net name.
  GoogleClientId:
    Type: String
    Default: ""
    Description: The Google OAuth web client's id (not secret; its secret is in SSM at GoogleSecretParameter).
  GoogleSecretParameter:
    Type: String
    Default: /koldenworld/google-client-secret
  CloudFrontKeyParameter:
    Type: String
    Default: /koldenworld/cloudfront-key
    Description: The SSM SecureString holding the private key that signs CloudFront cookies (PKCS#1 PEM).
  CloudFrontPublicKey:
    Type: String
    Default: ""
    Description: Its public key (PEM), for CloudFront's key group.

Conditions:
  HasDomain: !Not [!Equals [!Ref CertificateArn, ""]]
  HasAuth: !And
    - !Not [!Equals [!Ref GoogleClientId, ""]]
    - !Not [!Equals [!Ref CloudFrontPublicKey, ""]]

Resources:
  Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: data
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # The inputs: OSM cell files and elevation.
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub arn:aws:s3:::${Bucket}/osm/*
                  - !Sub arn:aws:s3:::${Bucket}/dem/*
              # Built cells: read, and written on a miss.
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject]
                Resource: !Sub arn:aws:s3:::${Bucket}/cells/*
              # Listing makes a missing object a 404 (not a 403): how a missing cell or ocean tile is told.
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub arn:aws:s3:::${Bucket}
              # Sign-in: the database (as the role db.rs's migrate maps this one to), and the two secrets.
              - Effect: Allow
                Action: dsql:DbConnect
                Resource: !GetAtt Database.ResourceArn
              - Effect: Allow
                Action: ssm:GetParameter
                Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${GoogleSecretParameter}
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${CloudFrontKeyParameter}

  # Players and sessions (crates/cellgen/migrations/, applied by deploy.sh). Serverless: nothing to pay while idle.
  Database:
    Type: AWS::DSQL::Cluster
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      DeletionProtectionEnabled: true
      Tags: [{ Key: Name, Value: koldenworld }]

  # CloudFront's access logs: every request, cached or not (time, client address, path, status, bytes, user agent),
  # as gzipped files under cloudfront/. Private; kept 90 days. CloudFront's legacy logging writes with an ACL
  # (granted to its log delivery account when the distribution is deployed), so the bucket allows ACLs.
  AccessLogs:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    Properties:
      BucketName: !Sub koldenworld-logs-${AWS::AccountId}
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerPreferred }]
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      LifecycleConfiguration:
        Rules:
          - Id: expire
            Status: Enabled
            ExpirationInDays: 90

  # The server's own log: a line per request (status, time taken, path, client, user agent), and cell builds.
  Logs:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/koldenworld
      RetentionInDays: 14

  Function:
    Type: AWS::Lambda::Function
    DependsOn: Logs
    Properties:
      FunctionName: koldenworld
      PackageType: Image
      Code: { ImageUri: !Ref ImageUri }
      Architectures: [arm64]
      Role: !GetAtt Role.Arn
      # Memory buys CPU on Lambda; the page and row-group caches take ~800 MB of it.
      MemorySize: 3008
      # A cold cell from S3 takes seconds; CloudFront gives up at 60 s anyway.
      Timeout: 60
      # Instances at most: plenty for players once they must sign in; few while anyone may make cells build.
      ReservedConcurrentExecutions: !If [HasAuth, 100, 5]
      Environment:
        Variables: !If
          - HasAuth
          - AUTH_ORIGIN: !If [HasDomain, !Sub "https://${Domain}", !Ref AWS::NoValue]
            AUTH_AT_EDGE: "1"
            GOOGLE_CLIENT_ID: !Ref GoogleClientId
            GOOGLE_CLIENT_SECRET_SSM: !Ref GoogleSecretParameter
            CLOUDFRONT_KEY_SSM: !Ref CloudFrontKeyParameter
            CLOUDFRONT_KEY_PAIR_ID: !Ref SigningKey
            DSQL_ENDPOINT: !GetAtt Database.Endpoint
          - !Ref AWS::NoValue

  Url:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !Ref Function
      AuthType: AWS_IAM

  # Only this distribution may call the URL: invoking through the URL, and invoking the function (only via the URL).
  CloudFrontUrl:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunctionUrl
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
      FunctionUrlAuthType: AWS_IAM
  CloudFrontInvoke:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Function
      Action: lambda:InvokeFunction
      Principal: cloudfront.amazonaws.com
      SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}
      InvokedViaFunctionUrl: true

  # What CloudFront checks signed cookies against: the public half of the key in CloudFrontKeyParameter.
  SigningKey:
    Type: AWS::CloudFront::PublicKey
    Condition: HasAuth
    Properties:
      PublicKeyConfig:
        Name: koldenworld-cookies
        CallerReference: koldenworld-cookies
        EncodedKey: !Ref CloudFrontPublicKey
  Players:
    Type: AWS::CloudFront::KeyGroup
    Condition: HasAuth
    Properties:
      KeyGroupConfig:
        Name: koldenworld-players
        Items: [!Ref SigningKey]

  OriginAccess:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: koldenworld-lambda
        OriginAccessControlOriginType: lambda
        SigningBehavior: always
        SigningProtocol: sigv4

  # The server answers no-store (so browsers keep nothing on disk); CloudFront keeps copies anyway, by these TTLs.
  # Cells don't change for a version, and a deploy clears the cache.
  CellsCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: koldenworld-cells
        MinTTL: 86400
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: none }
  # Live air traffic: everyone shares one upstream call for a few seconds (the sources rate-limit).
  AircraftCache:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: koldenworld-aircraft
        MinTTL: 5
        DefaultTTL: 5
        MaxTTL: 10
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig: { CookieBehavior: none }
          HeadersConfig: { HeaderBehavior: none }
          QueryStringsConfig: { QueryStringBehavior: all }

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: koldenworld
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Logging:
          Bucket: !GetAtt AccessLogs.DomainName
          Prefix: cloudfront/
          IncludeCookies: false
        Aliases: !If [HasDomain, [!Ref Domain], !Ref AWS::NoValue]
        ViewerCertificate: !If
          - HasDomain
          - AcmCertificateArn: !Ref CertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: lambda
            # The function URL's host: https://<id>.lambda-url.<region>.on.aws/ → <id>.lambda-url.<region>.on.aws
            DomainName: !Select [2, !Split ["/", !GetAtt Url.FunctionUrl]]
            OriginAccessControlId: !GetAtt OriginAccess.Id
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols: [TLSv1.2]
              # The most CloudFront allows without a quota increase: a cold cell takes seconds, not this.
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          # The viewer's files: CloudFront's managed CachingOptimized (a day without headers; a deploy clears it).
          TargetOriginId: lambda
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
          # Managed UserAgentRefererHeaders: the browser's user agent and referer reach the server's log (not in the
          # cache key), on every behavior.
          OriginRequestPolicyId: acba4595-bd28-49b8-b9fe-13317c0390fa
        CacheBehaviors:
          - PathPattern: /ground/*
            TargetOriginId: lambda
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref CellsCache
            TrustedKeyGroups: !If [HasAuth, [!Ref Players], !Ref AWS::NoValue]
            OriginRequestPolicyId: acba4595-bd28-49b8-b9fe-13317c0390fa
          - PathPattern: /aircraft
            TargetOriginId: lambda
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            Compress: true
            CachePolicyId: !Ref AircraftCache
            TrustedKeyGroups: !If [HasAuth, [!Ref Players], !Ref AWS::NoValue]
            OriginRequestPolicyId: acba4595-bd28-49b8-b9fe-13317c0390fa
          # Sign-in: never cached; the browser's cookies and query reach the server (managed CachingDisabled and
          # AllViewerExceptHostHeader).
          - PathPattern: /auth/*
            TargetOriginId: lambda
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac

Outputs:
  DistributionId:
    Value: !Ref Distribution
  DistributionDomain:
    Value: !GetAtt Distribution.DomainName
  RoleArn:
    Value: !GetAtt Role.Arn
  DatabaseEndpoint:
    Value: !GetAtt Database.Endpoint
  Url:
    Value: !If [HasDomain, !Sub "https://${Domain}/", !Sub "https://${Distribution.DomainName}/"]
