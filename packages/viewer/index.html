<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; background: #a9c8e6; overflow: hidden; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #instruments { position: fixed; inset: 0; pointer-events: none; }
    footer, #help, #hud { position: fixed; font: 12px system-ui, sans-serif; color: #1d2a38; pointer-events: none; }
    footer { right: 6px; bottom: 4px; font-size: 11px; pointer-events: auto; }
    #help, #hud { background: rgb(255 255 255 / 0.7); padding: 2px 6px; border-radius: 4px; }
    #help { left: 8px; top: 6px; }
    #hud { left: 8px; bottom: 4px; }
    footer a { color: inherit; }
    #place-search { position: fixed; left: 50%; top: 40px; transform: translateX(-50%); display: flex; gap: 8px;
      align-items: center; font: 14px system-ui, sans-serif; color: #1d2a38; background: rgb(255 255 255 / 0.9);
      padding: 6px 10px; border-radius: 6px; box-shadow: 0 2px 8px rgb(0 0 0 / 0.25); }
    #place-search[hidden] { display: none; }
    #place-search input { width: 360px; font: inherit; padding: 4px 6px; border: 1px solid #8aa0b8; border-radius: 4px; }
    #sign-in { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 24px; background: #a9c8e6; font: 16px system-ui, sans-serif; color: #1d2a38; }
    #sign-in h1 { margin: 0; font-weight: 600; letter-spacing: 0.02em; }
    #sign-in a { color: #1d2a38; background: #fff; padding: 10px 18px; border-radius: 6px; text-decoration: none;
      box-shadow: 0 2px 8px rgb(0 0 0 / 0.25); }
    #place-search span { max-width: 420px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
  </style>
</head>
<body>
  <canvas></canvas>
  <canvas id="instruments"></canvas>
  <div id="help">click to look (Esc releases) · WASD / arrows move · E / Space up · Q / C down · Shift fast · V drive · F on foot (Space jumps; 1–3 hands/pistol/rifle, hold the right button to aim, then left fires; R reloads) · G road graph · / go to a place</div>
  <div id="hud"></div>
  <footer>© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors · aircraft <a href="https://adsb.fi/">adsb.fi</a></footer>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
