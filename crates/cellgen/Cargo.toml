[package]
name = "cellgen"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.2.0"
arrow-buffer = "60.2.0"
arrow-ipc = "60.2.0"
arrow-schema = "60.2.0"
axum = "0.8.9"
clipper2-rust = { version = "1.2.0", features = ["using_z"] }
earcutr = "0.5.0"
glam = "0.34.3"
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "zstd"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "gzip"] }
robust = "1.2.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tiff = "0.11.3"
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync", "net", "io-util"] }
