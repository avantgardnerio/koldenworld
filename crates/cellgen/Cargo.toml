[package]
name = "cellgen"
version = "0.1.0"
edition = "2024"

[dependencies]
arrow-array = "60.2.0"
arrow-buffer = "60.2.0"
arrow-ipc = "60.2.0"
arrow-schema = "60.2.0"
aws-config = { version = "1.13.4", features = ["behavior-version-latest"] }
aws-sdk-dsql = "1.84.0"
aws-sdk-s3 = "1.162.0"
aws-sdk-ssm = "1.140.0"
axum = "0.8.9"
base64 = "0.23.1"
bytes = "1"
clipper2-rust = { version = "1.2.0", features = ["using_z"] }
earcutr = "0.5.0"
glam = "0.34.3"
parquet = { version = "60.2.0", default-features = false, features = ["arrow", "zstd"] }
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "form", "gzip"] }
robust = "1.2.0"
rsa = { version = "0.10.0", features = ["pkcs1v15", "sha1"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
tiff = "0.11.3"
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "fs", "sync", "net", "io-util"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["aws-lc-rs", "webpki-roots"] }
tower-http = { version = "0.6", features = ["fs"] }
